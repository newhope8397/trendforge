<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrendForge AI - Mastery Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- HEADER -->
  <header class="p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">TF</div>
      <span class="font-bold text-lg bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">TrendForge AI</span>
    </div>
    <span class="text-xs bg-indigo-950 text-indigo-300 px-2.5 py-1 rounded-full border border-indigo-800">JEE Mastery Engine</span>
  </header>

  <!-- SEARCH & CHAPTER BAR -->
  <div class="p-4 bg-slate-900/50 border-b border-slate-800 flex flex-col gap-2">
    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Search Any Topic or Chapter</label>
    <div class="flex gap-2">
      <input id="topic-input" type="text" placeholder="e.g. Class 12 Electrostatics, HC Verma Mechanics..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
      <button onclick="loadCustomTopic()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl text-sm transition">Generate</button>
    </div>
  </div>

  <!-- MAIN VIEW CONTAINER -->
  <main class="flex-1 p-4 max-w-lg mx-auto w-full flex flex-col gap-4">

    <!-- STUDY SECTION -->
    <section id="study-section" class="flex flex-col gap-4">
      
      <!-- MODE NAVIGATION -->
      <div class="flex gap-2 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
        <button id="tab-formulas" onclick="switchStudyTab('formulas')" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white">Formulas & Schematics</button>
        <button id="tab-quiz" onclick="switchStudyTab('quiz')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-slate-200">Adaptive Quiz</button>
      </div>

      <!-- FORMULA SUB-TABS -->
      <div id="formula-controls" class="flex flex-col gap-3">
        <div class="flex bg-slate-900/80 p-1 rounded-lg border border-slate-800 text-xs">
          <button id="deck-type-key" onclick="setDeckType('key')" class="flex-1 py-1.5 rounded text-indigo-400 font-bold">Key Formulas (Revision)</button>
          <button id="deck-type-full" onclick="setDeckType('full')" class="flex-1 py-1.5 rounded text-slate-400">Complete Deck (Exhaustive)</button>
        </div>

        <!-- FORMULA CARD -->
        <div id="formula-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 min-h-[340px] flex flex-col justify-between shadow-xl">
          <div>
            <div class="flex justify-between items-start">
              <span id="formula-tag" class="text-xs font-bold text-cyan-400 bg-cyan-950 px-2 py-0.5 rounded border border-cyan-800">TAG</span>
              <span id="formula-counter" class="text-xs text-slate-500">Card 1 of 5</span>
            </div>
            <h2 id="formula-title" class="text-lg font-bold mt-2 text-slate-100">Formula Title</h2>
            <div id="formula-math" class="my-3 text-indigo-300 font-mono text-base bg-slate-950 p-3 rounded-lg border border-slate-800"></div>
            
            <!-- SCHEMATIC CONTAINER -->
            <div id="schematic-container" class="my-2 bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-center items-center">
              <!-- SVG Schematic Rendered Dynamically -->
            </div>

            <p id="formula-desc" class="text-xs text-slate-300 leading-relaxed mt-2"></p>
          </div>

          <div class="flex gap-2 mt-4">
            <button onclick="prevFormulaCard()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-medium">Previous</button>
            <button onclick="nextFormulaCard()" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-medium">Next Formula →</button>
          </div>
        </div>
      </div>

      <!-- QUIZ CONTROLS -->
      <div id="quiz-controls" class="hidden flex-col gap-3">
        <!-- DIFFICULTY SELECTION -->
        <div class="flex gap-1 bg-slate-900 p-1 rounded-lg border border-slate-800 text-xs">
          <button id="tier-1" onclick="setQuizTier(1)" class="flex-1 py-1.5 rounded bg-indigo-600 text-white">NCERT</button>
          <button id="tier-2" onclick="setQuizTier(2)" class="flex-1 py-1.5 rounded text-slate-400">JEE Main</button>
          <button id="tier-3" onclick="setQuizTier(3)" class="flex-1 py-1.5 rounded text-slate-400">JEE Adv</button>
        </div>

        <!-- QUESTION CARD -->
        <div id="question-box" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
          <div class="flex justify-between items-center text-xs">
            <span id="quiz-tier-label" class="font-bold text-amber-400 bg-amber-950/80 px-2 py-0.5 rounded border border-amber-800">NCERT Level</span>
            <span id="quiz-progress" class="text-slate-400">Q 1 of 5</span>
          </div>

          <p id="quiz-question-text" class="text-sm font-semibold text-slate-100 leading-relaxed"></p>

          <div id="quiz-options-list" class="flex flex-col gap-2"></div>

          <div id="quiz-solution-box" class="hidden text-xs bg-slate-950 p-3 rounded-lg border border-slate-800 text-slate-300 leading-relaxed"></div>
        </div>

        <button id="next-q-btn" onclick="nextQuizQuestion()" class="hidden w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium text-xs">Next Question →</button>
      </div>

      <!-- DIAGNOSTIC REMEDIAL REPORT -->
      <div id="diagnostic-report" class="hidden bg-slate-900 border border-amber-800/60 rounded-2xl p-5 flex-col gap-3">
        <h3 class="text-sm font-bold text-amber-400">Diagnostic Weak-Spot Report</h3>
        <p class="text-xs text-slate-300">Here are the exact concepts you missed. Review these customized remedial flashcards before re-attempting:</p>
        <div id="remedial-cards-container" class="flex flex-col gap-2"></div>
      </div>

    </section>

  </main>

  <!-- SCRIPTS -->
  <script src="js/ai-engine.js"></script>
  <script src="js/formula-decks.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/remedial-deck.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
